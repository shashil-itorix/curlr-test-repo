openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  x-curlr:
    default_env: development
servers:
- url: https://httpbin.org
  description: httpbin
paths:
  /json:
    get:
      summary: Get sample JSON
      operationId: getJson
      responses:
        default:
          description: Response
      x-curlr:
        request:
          url: https://httpbin.org/json
          auth: null
  /uuid:
    get:
      summary: Get a UUID
      operationId: getUuid
  /headers:
    get:
      summary: Inspect request headers
      operationId: getHeaders
  /post:
    post:
      summary: Echo POST body
      operationId: echoPost
  /status/404:
    get:
      summary: Simulate a 404
      operationId: get404
